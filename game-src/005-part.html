<script src="./three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
// ---------- Thai / English: every piece of text on screen goes through trS() ----------
// The game is written in English. In Thai mode a watcher swaps any English text shown in the page for its Thai line
// from TH (exact line first, then the same line with its numbers as #, then each part between " · ").
// Elements marked data-notr (codes, names people type) are never touched.
const THAI_READY=true;// the Thai lines are still being finished: until then the game stays in English and the switch is hidden
let LANG='en';try{if(THAI_READY)LANG=localStorage.getItem('qc-lang')||(/[?&#]th\b/.test(location.search+location.hash)?'th':0)||((navigator.language||'').toLowerCase().startsWith('th')?'th':'en');}catch(e){}
const TH={},TH_W=[];function thLoad(o){for(const k in o){const v=o[k];if(v==null)continue;{const m=/^([A-Z][\w’' ]{0,24}):\s(.+)$/.exec(k),mv=/^[^:]{1,30}:\s(.+)$/.exec(v);if(m&&mv&&TH[m[2]]==null)TH[m[2]]=mv[1];}if(k.includes('*')){const re=new RegExp('^'+k.replace(/[.?+^$()[\]{}|\\]/g,'\\$&').replace(/\*/g,'(.+?)')+'$');TH_W.push([re,v]);}else TH[k]=v;}}
const TH_CAP=window.__trCap?(window.__trCapSet=new Set()):null;
function trS(s){if(LANG!=='th'||!s)return s;const t=s.trim();if(!t||!/[A-Za-z]/.test(t))return s;let r=TH[t];
  if(r==null){const nums=[];const k=t.replace(/\d+(?:[.,:]\d+)*/g,m=>{nums.push(m);return'#';});const v=nums.length?TH[k]:null;if(v!=null){let i=0;r=v.replace(/#/g,()=>nums[i++]!=null?nums[i-1]:'#');}}
  if(r==null&&TH_W.length){const nums=[];const k=t.replace(/\d+(?:[.,:]\d+)*/g,m=>{nums.push(m);return'#';});for(const [re,tpl] of TH_W){const m=re.exec(k);if(!m)continue;let i=0,c=1;r=tpl.replace(/#|\*/g,ch=>ch==='#'?(nums[i++]!=null?nums[i-1]:'#'):trS(m[c++]||''));break;}}
  if(r==null&&t.includes(' · ')){const parts=t.split(' · ');const tp=parts.map(p=>trS(p));if(tp.some((p,i)=>p!==parts[i]))r=tp.join(' · ');}
  if(r==null){const m=/^([A-Z][\w’' ]{0,24}):\s(.+)$/.exec(t);if(m){const b=trS(m[2]);if(b!==m[2])r=trS(m[1])+': '+b;}}
  if(r==null){if(TH_CAP)TH_CAP.add(t);return s;}return s.replace(t,r);}
function trNode(n){if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('[data-notr],script,style,textarea'))return;
  if(n.__tr!==undefined&&n.data===n.__tr)return;n.__en=n.data;const t=LANG==='th'?trS(n.data):n.data;n.__tr=t;if(t!==n.data)n.data=t;}
function trWalk(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(n.__en!==undefined&&n.__tr!==undefined&&n.data===n.__tr){const t=LANG==='th'?trS(n.__en):n.__en;n.__tr=t;n.data=t;}else trNode(n);}
  root.querySelectorAll&&root.querySelectorAll('[placeholder]').forEach(e=>{if(e.__enp==null)e.__enp=e.getAttribute('placeholder');e.setAttribute('placeholder',LANG==='th'?trS(e.__enp):e.__enp);});}
let trObs=null;function trStart(){if(trObs||typeof MutationObserver==='undefined')return;trObs=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData'){trNode(m.target);continue;}m.addedNodes.forEach(n=>{if(n.nodeType===3)trNode(n);else if(n.nodeType===1)trWalk(n);});}});
  trObs.observe(document.body,{childList:true,subtree:true,characterData:true});trWalk(document.body);}
function setLang(l){LANG=l;try{localStorage.setItem('qc-lang',l);}catch(e){}document.documentElement.lang=l;document.body.classList.toggle('th',l==='th');trWalk(document.body);document.querySelectorAll('.langBtn').forEach(b=>b.classList.toggle('on',b.dataset.l===l));}
// ---------- Thai lines ----------
