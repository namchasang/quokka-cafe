<style>
/* Layout: full-bleed pixel-art island; navy-and-gold JRPG panels float at the screen edges */
:root{
  --night:#0f1424;
  --panel:rgba(15,20,38,.86);
  --panel-solid:#151c34;
  --gold:#e2c27c;
  --gold-dim:#8c774a;
  --cream:#f5ecd8;
  --muted:#b8b09c;
  --sea:#5cc6d8;
  --leaf:#86b86e;
  --coral:#ef7d5e;
  --display:"Pixelify Sans","Mitr","Courier New",monospace;
  --body:"M PLUS Rounded 1c","Mitr","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%!important;height:100%!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.panel{background:var(--panel);border:1px solid var(--gold-dim);border-radius:6px;box-shadow:inset 0 0 0 2px rgba(10,14,28,.9),inset 0 0 0 3px rgba(226,194,124,.28),0 8px 22px rgba(0,0,0,.38)}

#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.leftcol{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:min(58vw,236px)}
.mm{padding:6px 6px 7px;pointer-events:auto;cursor:pointer}
.mmHint{margin-top:3px;font-size:10px;color:var(--gold-dim)}
.mapcard{max-width:920px}
#bigMap{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 0 0 1px rgba(226,194,124,.35)}
.legend.big{font-size:12px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px 12px;margin-top:10px}
.legend.big i{width:10px;height:10px}
.mapq{font-size:13px;font-weight:800;color:#ff8a7a;margin:10px 0 0}
#mm{display:block;width:100%;height:auto;border-radius:3px;box-shadow:0 0 0 1px rgba(226,194,124,.3)}
.mmT{margin-top:5px;font-size:11px;font-weight:800;color:#ff8a7a;line-height:1.3}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:2px 6px;margin-top:4px;font-size:10px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:block}
.lg-you{background:#ffd34d}.lg-quest{background:#ff5d5d}.lg-npc{background:#3f7fe0;box-shadow:0 0 0 1px #fff}.lg-lore{background:#8fe8ff;border-radius:1px!important;transform:rotate(45deg) scale(.85)}.lg-cafe{background:#e2584f;border-radius:1px!important}.lg-light{background:#f3efe6;box-shadow:inset 0 0 0 2px #c9473f}.lg-shell{background:#f6b8a8}.lg-lake{background:#ef9fb3;border-radius:1px!important}.lg-wild{background:#d9b48a}.lg-tourist{background:#fff;border-radius:1px!important}.lg-cottage{background:#3f7a5a;border-radius:1px!important}.lg-home,.lg-myhome{background:#ffd34d;border-radius:0!important;clip-path:polygon(50% 0,100% 100%,0 100%)}.lg-myhome{background:#86b86e}.lg-trail{background:#dcd2bb;border-radius:1px!important;height:4px!important}.lg-beach{background:#f6f1e3;border-radius:1px!important}.lg-tree{background:#2c5a3c}.lg-reef{background:#2f8a9a;border-radius:1px!important}
.clock{padding:8px 12px 9px;min-width:0}
.clock .top{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.wx{pointer-events:auto;background:rgba(255,255,255,.04);border:1px solid rgba(226,194,124,.35);border-radius:3px;padding:1px 7px;font-size:11px;font-weight:700;color:var(--cream)}
.clock .day{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.clock .time{font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.clock .phase{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:rgba(134,184,110,.18);color:var(--leaf)}
.clock .phase.explore{background:rgba(92,198,216,.16);color:var(--sea)}
.clock .obj{margin-top:5px;font-size:12px;line-height:1.35;color:var(--muted)}
.clock .carry{margin-top:4px;font-size:12px;color:var(--gold);font-weight:700}
.right{display:flex;gap:6px;align-items:center;flex-shrink:0}
.coins{display:flex;align-items:center;gap:6px;padding:7px 11px;font-family:var(--body);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.coins i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b8,#f0c040 45%,#a87a18);box-shadow:0 0 0 1px #5a3e10;display:block}
.hudBtn{pointer-events:auto;padding:8px 10px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
.right{flex-wrap:wrap;justify-content:flex-end;max-width:44vw}
.qtabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.qtab{padding:6px 10px;border:1px solid rgba(226,194,124,.35);border-radius:3px;background:transparent;color:var(--muted);font-size:12px;font-weight:800}
.qtab.on{background:var(--gold);border-color:var(--gold);color:#1a1408}
.qtab.done{opacity:.6}
.qgiver{font-size:12px;font-weight:700;color:var(--sea);margin:-4px 0 8px}
.qstatus{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;vertical-align:middle;background:rgba(92,198,216,.16);color:var(--sea);font-family:var(--body)}
.qstatus.done{background:rgba(134,184,110,.2);color:var(--leaf)}
.qstatus.track{background:rgba(255,93,93,.18);color:#ff8a7a}
.qsteps{list-style:none;padding:0;margin:4px 0 12px;display:grid;gap:7px}
.qsteps li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14px;line-height:1.45;align-items:start}
.qsteps .ck{width:16px;height:16px;border:1.5px solid var(--gold-dim);border-radius:3px;display:grid;place-items:center;font-size:11px;font-weight:800;font-style:normal;margin-top:2px;color:#0f1424}
.qsteps li.done .ck{background:var(--leaf);border-color:var(--leaf)}
.qsteps li.done span{color:var(--muted);text-decoration:line-through}
.qsteps li.next .ck{border-color:#ff8a7a;box-shadow:0 0 0 2px rgba(255,93,93,.25)}
.qsteps li.next span{color:var(--cream);font-weight:800}
.qsteps li span{color:var(--muted)}
.qreward{font-size:13px;color:var(--muted);padding-top:10px;border-top:1px solid rgba(226,194,124,.2)}
.qreward b{color:var(--gold)}

#act{position:absolute;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:92px;height:92px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 50% 35%,#24305a,#121830);display:grid;place-items:center;text-align:center;padding:10px;font-size:12px;font-weight:800;line-height:1.2;z-index:6;box-shadow:0 0 0 4px rgba(15,20,38,.6),0 8px 20px rgba(0,0,0,.4);--p:0}
#act::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 56%,#000 57%);mask:radial-gradient(circle,transparent 56%,#000 57%);pointer-events:none}
#act.off{border-color:var(--gold-dim);color:var(--muted);opacity:.7}
#act .key{display:block;font-family:var(--display);font-size:10px;color:var(--gold);margin-top:3px;letter-spacing:.1em}
#rot{position:absolute;right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 136px);display:grid;grid-template-columns:repeat(2,42px);gap:8px;z-index:6}
#rot button{width:42px;height:42px;border-radius:50%;font-size:20px;line-height:1;color:var(--gold);display:grid;place-items:center;padding:0}
#rideBtn{position:absolute;right:calc(max(16px,env(safe-area-inset-right,0px)) + 112px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:62px;height:62px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 50% 35%,#24305a,#121830);color:var(--cream);font-size:11px;font-weight:800;display:grid;place-items:center;align-content:center;z-index:6}
#rideBtn small{font-family:var(--display);font-size:10px;color:var(--gold)}
#rideBtn.off{display:none}
#rideBtn.on{background:radial-gradient(circle at 50% 35%,#3e7d5c,#1d3a2a)}
#camBtn{position:absolute;right:calc(max(16px,env(safe-area-inset-right,0px)) + 112px);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);width:62px;height:62px;border-radius:50%;border:2px solid var(--gold-dim);background:radial-gradient(circle at 50% 35%,#24305a,#121830);color:var(--muted);font-size:11px;font-weight:800;display:grid;place-items:center;align-content:center;gap:0;z-index:6}
#camBtn small{font-family:var(--display);font-size:10px;color:var(--gold-dim)}
#camBtn.ready{border-color:var(--gold);color:var(--cream);box-shadow:0 0 0 4px rgba(226,194,124,.25);animation:camp 1.2s ease-in-out infinite}
@keyframes camp{50%{box-shadow:0 0 0 8px rgba(226,194,124,.1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.on{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#camBtn.ready{animation:none}#flash.on{animation:none}}
.pcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;max-height:52vh;overflow-y:auto;padding-right:4px}
.pc{border:1px solid rgba(226,194,124,.3);border-top:4px solid var(--c);border-radius:4px;background:rgba(255,255,255,.03);padding:6px;display:grid;gap:4px;min-width:0}
.pc .ph{aspect-ratio:3/2;border-radius:3px;background:#0f1424;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--gold);overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover;image-rendering:auto}
.pc .nm{font-size:12px;font-weight:800;line-height:1.25;min-width:0}
.pc .zn{font-size:10.5px;color:var(--muted)}
.pc.miss{opacity:.55}
.pc.miss .ph{color:var(--muted)}
#trackBar{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);max-width:min(460px,calc(100vw - 32px));padding:8px 16px;text-align:center;pointer-events:none;z-index:4}
#trackBar .tbE{font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#ff8a7a}
#tbTitle{font-size:15px;font-weight:800;color:var(--cream);text-wrap:balance}
#tbStep{font-size:12.5px;color:var(--muted);line-height:1.35;text-wrap:balance}
#menuBtn{display:block;font-size:14px;padding:7px 10px}

 #rot button{width:84px;height:84px;font-size:36px;border-width:2px}

 #rideBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}#camBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}#rideBtn:not(.off)~#camBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}#frBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 310px)}
}

.right.open .hudBtn.more{display:block}

.cfGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cfS{border:1px solid rgba(226,194,124,.25);border-radius:6px;padding:8px;display:grid;gap:4px;align-content:start;min-width:0}.cfS.on{border-color:var(--gold);background:rgba(226,194,124,.08)}
.cfS b{font-size:13.5px}.cfS p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.35}.cfS .btn{padding:5px 10px;font-size:11.5px;margin-top:2px}
.cfSw{display:flex;height:22px;border-radius:4px;overflow:hidden}.cfSw i{flex:1}
.rdList{display:grid;gap:6px;margin:8px 0}
.rdS{display:grid;gap:2px;text-align:left;padding:10px 12px;border:1px solid rgba(226,194,124,.25);border-radius:6px;background:rgba(255,255,255,.03);color:var(--cream);font:inherit;cursor:pointer}
.rdS b{font-size:14px}.rdS span{font-size:12px;color:var(--muted)}
.rdS.on{border-color:var(--gold);background:rgba(226,194,124,.12)}.rdS.on b{color:var(--gold)}
.rdVol{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.rdVol input{flex:1;accent-color:var(--gold)}
.slMove{margin-top:10px;border-top:1px solid rgba(226,194,124,.25);padding-top:8px}.slMove summary{cursor:pointer;color:var(--gold);font-weight:800;font-size:13px}
#slCode{width:100%;box-sizing:border-box;margin-top:8px;background:rgba(0,0,0,.25);color:var(--cream);border:1px solid rgba(226,194,124,.3);border-radius:4px;padding:6px;font:12px monospace;resize:vertical}
#visitBar{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:8px 10px 8px 14px;pointer-events:auto;z-index:7;max-width:calc(100vw - 32px);border-color:#c8a0ff}
#visitBar b{display:block;color:#e0c8ff;font-size:14px}#visitBar span{display:block;font-size:11.5px;color:var(--muted)}#visitBar .btn{padding:6px 12px;font-size:12px;white-space:nowrap}
body:has(#visitBar:not([hidden])) #trackBar{display:none}
.vsRow{display:flex;gap:8px;flex-wrap:wrap}.vsRow input,#vsCode{flex:1;min-width:0;box-sizing:border-box;background:rgba(0,0,0,.25);color:var(--cream);border:1px solid rgba(226,194,124,.3);border-radius:4px;padding:8px;font:13px inherit}#vsCode{width:100%;font:12px monospace;resize:vertical}
.stam{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px;font-weight:800;color:var(--muted)}.stam i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}.stam b{display:block;height:100%;width:100%;background:#86d06a;transition:width .4s,background .4s}.stam em{font-style:normal;min-width:30px;text-align:right;color:var(--cream)}
.stam.low b{background:#f1c64a}.stam.crit b{background:#e8574a;animation:stp 1s infinite}@keyframes stp{50%{opacity:.4}}@media (prefers-reduced-motion:reduce){.stam.crit b{animation:none}}
#hpCanvas{width:100%;max-width:520px;aspect-ratio:13/8;image-rendering:pixelated;border-radius:6px;display:block;margin:6px auto;border:1px solid rgba(226,194,124,.35)}
.trRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid rgba(226,194,124,.25);border-radius:6px;flex-wrap:wrap}.trRow b{display:block;font-size:14px}.trRow span{font-size:12px;color:var(--muted)}.trBtns{display:flex;gap:6px}.trBtns .btn{padding:6px 10px;font-size:12px}
#cine{position:absolute;inset:0;pointer-events:none;z-index:8}#cine .cbT,#cine .cbB{position:absolute;left:0;right:0;height:11vh;background:#05070d}#cine .cbT{top:0}#cine .cbB{bottom:0}
#cineCap{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(11vh + 18px);max-width:min(520px,80vw);opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s;text-shadow:0 2px 8px rgba(0,0,0,.8)}#cineCap.on{opacity:1;transform:none}
#cineCap b{display:block;font-family:var(--display);font-size:clamp(22px,4vw,36px);color:var(--gold)}#cineCap span{display:block;font-size:clamp(13px,1.8vw,16px);color:var(--cream);line-height:1.4}
#cineSkip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(11vh - 46px);pointer-events:auto;padding:6px 14px;font-size:12px;background:rgba(15,20,38,.7)}
body.cineOn #hud,body.cineOn #act,body.cineOn #rot,body.cineOn #camBtn,body.cineOn #rideBtn,body.cineOn #frBtn,body.cineOn #joyHint,body.cineOn #visitBar,body.cineOn #toast{visibility:hidden}
@media (prefers-reduced-motion:reduce){#cineCap{transition:none}}
#joyHint{position:absolute;left:calc(max(16px,env(safe-area-inset-left,0px)) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:96px;height:96px;border-radius:50%;border:2px dashed rgba(226,194,124,.45);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;pointer-events:none;z-index:4}
#joy{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(226,194,124,.6);background:rgba(15,20,38,.35);pointer-events:none;z-index:6}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f5ecd8,#e2c27c 60%,#8c774a)}

#dlg{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);max-width:640px;margin:0 auto;padding:18px 18px 14px;z-index:8;cursor:pointer}
#dlg .who{position:absolute;top:-13px;left:14px;padding:3px 12px;background:var(--panel-solid);border:1px solid var(--gold);border-radius:4px;font-family:var(--display);font-size:14px;color:var(--gold);letter-spacing:.06em}
#dlg p{margin:0;font-size:15px;line-height:1.6;min-height:3.2em;max-width:65ch}
