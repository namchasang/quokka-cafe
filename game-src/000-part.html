<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1424">
<meta name="description" content="Quokka Cafe and Friends: a cozy pixel-art café sim on Rottnest Island, Perth.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quokka Cafe">
<style>html,body{margin:0;height:100%;background:#0f1424;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
<title>Quokka Cafe and Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
</head>
<body>
<style>
/* Layout: full-bleed pixel-art island; navy-and-gold JRPG panels float at the screen edges */
:root{
  --night:#0f1424;
  --panel:rgba(15,20,38,.86);
  --panel-solid:#151c34;
  --gold:#e2c27c;
  --gold-dim:#8c774a;
  --cream:#f5ecd8;
  --muted:#b8b09c;
  --sea:#5cc6d8;
  --leaf:#86b86e;
  --coral:#ef7d5e;
  --display:"Pixelify Sans","Mitr","Courier New",monospace;
  --body:"M PLUS Rounded 1c","Mitr","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%!important;height:100%!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.panel{background:var(--panel);border:1px solid var(--gold-dim);border-radius:6px;box-shadow:inset 0 0 0 2px rgba(10,14,28,.9),inset 0 0 0 3px rgba(226,194,124,.28),0 8px 22px rgba(0,0,0,.38)}

#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.leftcol{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:min(58vw,236px)}
.mm{padding:6px 6px 7px;pointer-events:auto;cursor:pointer}
.mmHint{margin-top:3px;font-size:10px;color:var(--gold-dim)}
.mapcard{max-width:920px}
