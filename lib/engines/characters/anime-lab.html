<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anime Character Lab</title>
<!-- Anime Character Lab (Paul, 23 Nov 2026): the cast as anime-style 3D animals (lib/engines/characters/anime.js). Line-up, walk, run,
     a close-up per character, the game camera, outline and rim switches. ?view=game|close|line ?who=kip ?move=walk|run -->
<style>
:root{--pan:rgba(16,22,34,.78);--ink:#f6efe0;--line:#e8c37a}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd0f0;font:600 13px system-ui,sans-serif;color:#fff;touch-action:none}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;padding:7px 10px;border-radius:10px;background:var(--pan);color:var(--ink);line-height:1.45;max-width:78vw}
#ui{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 8px}
button{padding:7px 10px;border-radius:999px;border:2px solid var(--line);background:#1d2a3a;color:var(--ink);font:700 12px system-ui;cursor:pointer}
button.on{background:#f2b632;color:#2a1d08;border-color:#ffd84a}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head><body>
<div id="hud"><b>Anime Character Lab</b> · ตัวละครสัตว์แบบอนิเมะ 3D<br><span id="info"></span></div>
<div id="ui"></div>
<script src="anime.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),Q=new URLSearchParams(location.search);
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.setSize(innerWidth,innerHeight);R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8cc8f0);scene.fog=new THREE.Fog(0xbfe0f4,40,110);
const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,300);const ctl=new THREE.OrbitControls(cam,R.domElement);ctl.enableDamping=true;ctl.maxPolarAngle=1.52;ctl.minDistance=1;ctl.maxDistance=60;
scene.add(new THREE.HemisphereLight(0xd8ecff,0xc8a888,.75));const sun=new THREE.DirectionalLight(0xfff0d8,1.25);sun.position.set(8,14,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:60});sun.shadow.bias=-.0006;sun.shadow.normalBias=.02;scene.add(sun);
// a sunny stone plaza with a terracotta path, like a seaside town square
const tile=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#b8ae9c';g.fillRect(0,0,256,256);
  for(let j=0;j<8;j++)for(let i=0;i<4;i++){const o=(j%2)*32,v=196+Math.random()*22|0;g.fillStyle=`rgb(${v},${v-5},${v-14})`;g.fillRect(i*64+o-64+2,j*32+2,60,28);g.fillRect(i*64+o+2,j*32+2,60,28);}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(30,30);t.anisotropy=8;return t;})();
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshLambertMaterial({map:tile}));gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);
const ring=new THREE.Mesh(new THREE.RingGeometry(7.6,8.6,96),new THREE.MeshLambertMaterial({color:new THREE.Color(0xd8784a).convertSRGBToLinear()}));ring.rotation.x=-Math.PI/2;ring.position.y=.01;ring.receiveShadow=true;scene.add(ring);
// cast
const ids=Object.keys(ANIME_CHARS.CAST);let HUMAN=Q.has('human'),C=[];
function buildCast(){C.forEach(c=>scene.remove(c.root));C=ids.map(k=>{const c=ANIME_CHARS.create(ANIME_CHARS.CAST[k],{human:HUMAN});c.id=k;scene.add(c.root);return c;});}buildCast();
let mode=Q.get('move')||'idle',view=Q.get('view')||'line',who=Q.get('who')||'kip',T=0;
function lineUp(){C.forEach((c,i)=>{c.root.position.set((i-(C.length-1)/2)*1.25,0,0);c.root.rotation.y=0;c.ang=null;});}
lineUp();
function setView(v){view=v;const c=C.find(q=>q.id===who)||C[0];const hh=HUMAN?c.spec.h:(c.spec.ah||c.spec.h*.8);
  if(v==='close'){const p=c.root.position,h=hh;ctl.target.set(p.x,h*.78,p.z);cam.position.set(p.x+h*.5,h*.95,p.z+h*1.45);}
  else if(v==='body'){const p=c.root.position,h=hh;ctl.target.set(p.x,h*.55,p.z);cam.position.set(p.x+h*.9,h*.9,p.z+h*2.6);}
  else if(v==='game'){ctl.target.set(0,.6,7.5);cam.position.set(0,6.2,13.2);}/* the game looks down from high up */
  else {ctl.target.set(0,HUMAN?.85:.6,0);cam.position.set(0,HUMAN?1.7:1.5,HUMAN?13.5:14);}ctl.update();}
setView(view);
const ui=$('#ui');const B=(t,f,on)=>{const b=document.createElement('button');b.textContent=t;if(on)b.classList.add('on');b.onclick=()=>f(b);ui.appendChild(b);return b;};
const grp=(list)=>{const bs=[];list.forEach(([t,f,on])=>{const b=B(t,()=>{bs.forEach(x=>x.classList.remove('on'));b.classList.add('on');f();},on);bs.push(b);});};
grp([['🧍 ยืน',()=>{mode='idle';lineUp();},mode==='idle'],['🚶 เดิน',()=>{mode='walk';},mode==='walk'],['🏃 วิ่ง',()=>{mode='run';},mode==='run']]);
grp([['👥 เรียงแถว',()=>setView('line'),view==='line'],['🎮 มุมกล้องในเกม',()=>setView('game'),view==='game'],['🔍 หน้าใกล้',()=>setView('close'),view==='close'],['🧍 ทั้งตัว',()=>setView('body'),view==='body']]);
const sel=document.createElement('select');sel.style.cssText='padding:7px 10px;border-radius:999px;border:2px solid #e8c37a;background:#1d2a3a;color:#f6efe0;font:700 12px system-ui';
C.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.spec.name+' · '+c.spec.role;o.selected=c.id===who;sel.appendChild(o);});sel.onchange=()=>{who=sel.value;if(view==='line'||view==='game')setView('close');else setView(view);};ui.appendChild(sel);
B('🐾 ตัวเป็นสัตว์',b=>{HUMAN=!HUMAN;b.textContent=HUMAN?'🧑 ตัวแบบคน (เดิม)':'🐾 ตัวเป็นสัตว์';buildCast();if(mode==='idle')lineUp();setView(view);},!HUMAN);
B('✒️ เส้นขอบ',b=>{const u=ANIME_CHARS.ink.uniforms.uW;u.value=u.value?0:.011;b.classList.toggle('on',!!u.value);},true);
B('✨ แสงขอบ',b=>{const r=ANIME_CHARS.rim;r.value=r.value?0:.32;b.classList.toggle('on',!!r.value);},true);
$('#info').textContent=C.map(c=>c.spec.name).join(' · ');
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());T+=dt;
  const sp=mode==='walk'?1:mode==='run'?2:0;
  C.forEach((c,i)=>{if(sp){const r=8.1,w=(sp===1?1.25:3.2)/r;c.ang=(c.ang==null?i/C.length*6.283:c.ang)+dt*w;c.root.position.set(Math.cos(c.ang)*r,0,Math.sin(c.ang)*r);c.root.rotation.y=-c.ang;}
    c.update(dt,sp);});
  if(sp&&(view==='close'||view==='body')){const c=C.find(q=>q.id===who);if(c){const p=c.root.position,d=ctl.target.clone();ctl.target.set(p.x,(HUMAN?c.spec.h:(c.spec.ah||c.spec.h*.8))*(view==='close'?.78:.55),p.z);cam.position.add(ctl.target.clone().sub(d));}}
  ctl.update();R.render(scene,cam);}
loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
window.LAB={get C(){return C;},setView,scene};
})();
</script>
</body></html>
