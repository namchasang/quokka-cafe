<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stream &amp; Falls Lab</title>
<!-- Stream & Falls Lab (Paul, 22 Nov 2026: "ออกแบบป่าให้เหมือนจริง แล้วสร้างลำธารตามระดับความสูงที่แตกต่างกันของพื้นที่
     ถ้ามีพื้นที่ต่างระดับกันมากๆ ค่อยสร้างน้ำตกเป็นทางน้ำ").
     Reference (web, 22 Nov 2026): the falls near the camps sit on the Darling Scarp. Serpentine Falls: water cascades down a sheer
     granite face "polished smooth by the rushing waters" into a "swirling, rock-rimmed pool" about 15 m below, in a cleft at the
     foot of the scarp; strongest in winter. Lesmurdie Falls: a brook cascades over the granite edge of the scarp (~40 m) and runs
     on as little rapids. So: no vertical sheet in a frame; water follows the rock.
     How it works: 1) height field of a scarp (plateau, steep granite scarp, cleft, coastal plain). 2) priority-flood fill + D8 flow
     directions + flow accumulation: the water finds its own way down. 3) cells with enough flow become streams; the bed is carved,
     wider where more water joins. 4) each stretch is classed by its slope: calm run (tea-coloured), rapids (boulders, white
     water), cascade (bare polished granite, white water sliding down the rock), pool (depressions filled, and a rock-rimmed
     plunge pool where a cascade ends). 5) forest by moisture and slope: jarrah/marri, grass trees on dry ground, ferns and
     sedges by the water, granite boulders. Winter/summer flow. Every layer has a switch. API: window.STREAMS. -->
<style>
:root{--pan:rgba(20,28,43,.84);--ink:#ffe6a8;--line:#e8c37a}
html,body{margin:0;height:100%;overflow:hidden;background:#8fc4e8;font:600 13px system-ui,sans-serif;color:#fff;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;padding:7px 10px;border-radius:10px;background:var(--pan);color:var(--ink);line-height:1.45;max-width:78vw}
#hud b{color:#fff}
#ui{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
button{padding:7px 10px;border-radius:999px;border:2px solid var(--line);background:#1d2a3a;color:var(--ink);font:700 12px system-ui;cursor:pointer}
button.on{background:#f2b632;color:#2a1d08;border-color:#ffd84a}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head><body>
<div id="hud"><b>Stream &amp; Falls Lab</b> · ลำธารตามความสูงของพื้น<br><span id="info">กำลังคำนวณทางน้ำ…</span><br><span id="fps">fps –</span></div>
<div id="ui"></div>
<script src="streams.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const SEED=+(new URLSearchParams(location.search).get('seed')||7);
// ---------- three.js scene ----------
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.setSize(innerWidth,innerHeight);R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fd0f0);scene.fog=new THREE.Fog(0xbfdcef,90,260);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,800);
const ctl=new THREE.OrbitControls(cam,R.domElement);ctl.enableDamping=true;ctl.maxPolarAngle=1.5;ctl.minDistance=4;ctl.maxDistance=260;
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x6b5a3a,.6));const sun=new THREE.DirectionalLight(0xfff1d6,1.15);sun.position.set(-50,70,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-95,right:95,top:95,bottom:-95,near:1,far:260});sun.shadow.bias=-.0008;scene.add(sun);
// the whole place comes from the Stream & Falls Engine (streams.js); this page only adds the camera, lights and buttons
const E=STREAMS_ENGINE.create({seed:SEED,lite:new URLSearchParams(location.search).has('lite')});scene.add(E.root);
const LAY=E.LAY,plunge=E.plunge,ST=E.streams,groundMat=E.groundMat,detailTex=E.detailTex,sprayL=E.sprayL,WU=E.WU;const {cascades:nC,pools:nP,maxDrop}=E.stats();let SEASON=1;const buildWater=()=>E.setSeason(SEASON);
// ---------- UI, cameras, loop ----------
const ui=$('#ui');const B=(t,f,on)=>{const b=document.createElement('button');b.textContent=t;if(on)b.classList.add('on');b.onclick=()=>f(b);ui.appendChild(b);return b;};
Object.entries(LAY).forEach(([k,g])=>B(g.name,b=>{g.visible=!g.visible;b.classList.toggle('on',g.visible);},true));
B('🔍 ลายพื้นใกล้ตา',b=>{groundMat.map=groundMat.map?null:detailTex;groundMat.color.setScalar(groundMat.map?1.12:1);groundMat.needsUpdate=true;b.classList.toggle('on',!!groundMat.map);},true);
const bS=B('❄️ หน้าหนาว (น้ำแรง)',b=>{SEASON=1-SEASON;b.textContent=SEASON?'❄️ หน้าหนาว (น้ำแรง)':'☀️ หน้าร้อน (น้ำน้อย)';buildWater();sprayL.visible=!!SEASON;});
const big=plunge.slice().sort((a,b)=>(b.top.y-b.y)-(a.top.y-a.y))[0];
function view(v){if(v==='falls'&&big){const dx=big.x-big.top.x,dz=big.z-big.top.z,l=Math.hypot(dx,dz)||1;ctl.target.set((big.x+big.top.x)/2,(big.y+big.top.y)/2,(big.z+big.top.z)/2);cam.position.set(big.x+dx/l*16+6,big.y+9,big.z+dz/l*16+4);}
  else if(v==='stream'&&big){ctl.target.set(big.x,big.y+1,big.z);cam.position.set(big.x+10,big.y+5,big.z+14);}
  else if(v==='top'&&big){ctl.target.set(big.x,big.y,big.z+8);cam.position.set(big.x+2,big.y+24,big.z+26);}
  else{ctl.target.set(0,8,0);cam.position.set(70,70,110);}ctl.update();}
B('🗺️ ภาพรวม',()=>view('all'));B('💦 น้ำตกใหญ่สุด',()=>view('falls'));B('🏞️ แอ่งน้ำ',()=>view('stream'));
const q=new URLSearchParams(location.search);if(q.has('summer'))bS.onclick(bS);view(q.get('view')||'all');
$('#info').textContent=`ลำธาร ${ST.length} สาย · น้ำตก/ช่วงไหลลงหินแกรนิต ${nC} แห่ง (สูงสุด ${maxDrop.toFixed(1)} ม.) · แอ่งน้ำใต้น้ำตก ${nP} แอ่ง`;
const clock=new THREE.Clock();let T=0,fN=0,fT=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());T+=dt;E.update(dt);fN++;fT+=dt;if(fT>1){$('#fps').textContent='fps '+Math.round(fN/fT);fN=0;fT=0;}
  ctl.update();R.render(scene,cam);}
loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
window.STREAMS={scene,engine:E,streams:ST,plunge,gAt:E.gAt,view,stats:()=>({streams:ST.length,cascades:nC,pools:nP,maxDrop})};
})();
</script>
</body></html>
