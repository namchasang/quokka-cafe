<title>Camp Kit Lab</title>
<!-- Camp Kit Lab (brief quokka-campsite-maps-20261114, Prompt 0; nightly team 21 Nov 2026).
     The shared kit for all six campsites as a standalone prototype: Kip's camper van, dome tent (pitch + blown away),
     campfire (off / on / embers), the things round the fire, picnic table, barbecue shelter, bin, toilet, camp sign,
     lantern, torch, blanket, snack basket; rain, sea fog, strong wind, stars + Milky Way, shooting stars;
     camp time of day afternoon -> dusk -> night -> dawn. Standard interaction points: camp_van, camp_tent, camp_fire,
     camp_cook, camp_food_box, camp_sign (+ peg_1..4). Everything is 3D toon; nothing here is in the game yet
     (it goes in later behind ?campkit). API for the story team: window.CAMPKIT. -->
<style>
:root{--bg:#141c2b;--pan:rgba(20,28,43,.82);--ink:#ffe6a8;--line:#e8c37a}

canvas{display:block}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;padding:6px 10px;border-radius:10px;background:var(--pan);color:var(--ink);line-height:1.4;max-width:70vw}
#hud b{color:#fff}
#ui{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
#ui .row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:100%}
button{padding:7px 10px;border-radius:999px;border:2px solid var(--line);background:#1d2a3a;color:var(--ink);font:700 12px system-ui;cursor:pointer}
button.on{background:#f2b632;color:#2a1d08;border-color:#ffd84a}
.tag{position:fixed;transform:translate(-50%,-120%);padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.6);color:#ffe6a8;font:700 11px ui-monospace,monospace;pointer-events:none;white-space:nowrap}
#drops{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div id="hud"><b>Camp Kit Lab</b> · ชุดของกลางทุกแคมป์<br><span id="fps">fps –</span> · <span id="tod">บ่าย</span><br><small>แตะของในฉากเพื่อลอง (ประตูรถ เต็นท์ กองไฟ กล่องอาหาร ป้าย)</small></div>

<div id="ui">
 <div class="row">
  <button data-t="0" class="on">☀️ บ่าย</button><button data-t="1">🌇 พลบค่ำ</button><button data-t="2">🌙 กลางคืน</button><button data-t="3">🌅 รุ่งสาง</button><button id="bAuto">⏩ เวลาเดิน</button>
 </div>
 <div class="row">
  <button id="bRain">🌧️ ฝน</button><button id="bFog">🌫️ หมอกทะเล</button><button id="bWind">💨 ลมแรง</button><button id="bStar">🌠 ดาวตก</button><button id="bPts">📍 จุดโต้ตอบ</button>

 <div class="row">
  <button id="bFire">🔥 กองไฟ: ติด</button><button id="bTent">⛺ กางเต็นท์</button><button id="bBlow">🌬️ เต็นท์ปลิว</button><button id="bDoor">🚐 ประตูรถ</button><button id="bLights">💡 ไฟหน้า</button><button id="bHorn">📯 แตร</button><button id="bCol">🎨 สีรถ</button><button id="bPat">🌼 ลายรถ</button><button id="bBox">📦 กล่องอาหาร</button><button id="bChick">🐥 ลูกนก</button><button id="bTorch">🔦 ไฟฉาย</button><button id="bSign">🪧 ป้าย</button>
 </div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.setSize(innerWidth,innerHeight);
R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xcfe6ff,40,140);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,600);cam.position.set(8.5,5,10);
const ctl=new THREE.OrbitControls(cam,R.domElement);ctl.target.set(-.5,.8,-1);ctl.enableDamping=true;ctl.maxPolarAngle=1.48;ctl.minDistance=3;ctl.maxDistance=60;
const clock=new THREE.Clock();let T=0;

// ---------- toon materials (banded shade like the Rottnest toon look) ----------
const grad=(()=>{const d=new Uint8Array([90,90,90,255,170,170,170,255,255,255,255,255]);const t=new THREE.DataTexture(d,3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const MC={};const M=(c,o)=>{const k=c+JSON.stringify(o||{});if(!o&&MC[k])return MC[k];const m=new THREE.MeshToonMaterial(Object.assign({color:c,gradientMap:grad},o||{}));if(!o)MC[k]=m;return m;};
const INK=new THREE.MeshBasicMaterial({color:0x1d1a24,side:THREE.BackSide});
function mesh(g,m,x,y,z,p){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=o.receiveShadow=true;(p||scene).add(o);return o;}
function ink(o,s){o.traverse(c=>{if(c.isMesh&&!c.userData.noInk&&c.material!==INK&&!c.material.transparent){const e=new THREE.Mesh(c.geometry,INK);e.scale.setScalar(1+(s||.04));e.userData.noInk=1;e.castShadow=false;c.add(e);}});}
function cnv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
const pick=[];// clickable things: {obj, id, act}
function hot(obj,id,act){obj.traverse(c=>{if(c.isMesh)c.userData.hot={id,act};});pick.push(obj);}

// ---------- light: sky fill ~0.55x, sun ~1.2x ----------
const hemi=new THREE.HemisphereLight(0xbfe0ff,0x6b7a4a,.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,1.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:120});sun.shadow.bias=-.0006;scene.add(sun,sun.target);

// ---------- ground: lawn round a sandy camp clearing ----------
const ground=mesh(new THREE.CircleGeometry(90,64),new THREE.MeshPhongMaterial({shininess:4,specular:0x000000,map:cnv(1024,1024,(g,w,h)=>{
  g.fillStyle='#7fae4f';g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){g.fillStyle=['#76a647','#89b85a','#6f9c43','#93c066'][i%4];g.fillRect(Math.random()*w,Math.random()*h,3,3);}
  const c=w/2,r=w*.06;const gr=g.createRadialGradient(c,c,r*.5,c,c,r*1.15);gr.addColorStop(0,'#e8d7ac');gr.addColorStop(.8,'#dcc896');gr.addColorStop(1,'rgba(220,200,150,0)');
  g.fillStyle=gr;g.beginPath();g.arc(c,c,r*1.15,0,7);g.fill();
})}));
ground.rotation.x=-Math.PI/2;ground.castShadow=false;
const wetMat=ground.material;const DRY=new THREE.Color(1,1,1),WET=new THREE.Color(.62,.66,.7);
const inClearing=(x,z)=>Math.hypot(x,z)<11.5;// per-pixel ground (Phong): per-vertex light on a big disc spreads the fire glow everywhere

// grass tufts and little flowers: cards that sway (never on the clearing or the path)
const swayU={value:0},windU={value:.25};
function swayMat(map,o){const m=new THREE.MeshLambertMaterial(Object.assign({map,alphaTest:.5,side:THREE.DoubleSide},o||{}));
  m.onBeforeCompile=s=>{s.uniforms.uT=swayU;s.uniforms.uW=windU;s.vertexShader='uniform float uT;uniform float uW;\n'+s.vertexShader.replace('#include <begin_vertex>',
  '#include <begin_vertex>\n#ifdef USE_INSTANCING\nvec4 wp=instanceMatrix*vec4(0.,0.,0.,1.);\n#else\nvec4 wp=vec4(0.);\n#endif\nfloat k=max(position.y,0.)*uW;transformed.x+=sin(uT*2.3+wp.x*.7+wp.z*.4)*k*.35+k*.25;transformed.z+=cos(uT*1.9+wp.z*.6)*k*.15;');
  s.fragmentShader=s.fragmentShader.replace('#include <lights_fragment_begin>','#include <lights_fragment_begin>');};return m;}
const tuftTex=cnv(128,128,(g,w,h)=>{for(let i=0;i<26;i++){const x=w*.15+Math.random()*w*.7;g.strokeStyle=['#5f9238','#7cb04a','#94c45c'][i%3];g.lineWidth=5;g.beginPath();g.moveTo(w/2+(x-w/2)*.3,h);g.quadraticCurveTo(x,h*.6,x+(Math.random()-.5)*30,h*.08+Math.random()*h*.3);g.stroke();}});
const flowTex=cnv(128,128,(g,w,h)=>{g.strokeStyle='#5f9238';g.lineWidth=4;for(let i=0;i<5;i++){const x=20+i*22;g.beginPath();g.moveTo(x,h);g.lineTo(x+6,40+i%2*18);g.stroke();g.fillStyle=['#fff6d8','#ffd84a','#f4a6c8'][i%3];g.beginPath();g.arc(x+6,36+i%2*18,9,0,7);g.fill();g.fillStyle='#e8a020';g.beginPath();g.arc(x+6,36+i%2*18,3,0,7);g.fill();}});
function cards(tex,n,size,minR,maxR){const g=new THREE.PlaneGeometry(size,size);g.translate(0,size/2,0);const g2=g.clone().rotateY(Math.PI/2);
  const geo=THREE.BufferGeometryUtils?THREE.BufferGeometryUtils.mergeBufferGeometries([g,g2]):g;const im=new THREE.InstancedMesh(geo,swayMat(tex),n);const d=new THREE.Object3D();let k=0;
  for(let i=0;i<n*4&&k<n;i++){const a=Math.random()*7,r=minR+Math.sqrt(Math.random())*(maxR-minR),x=Math.cos(a)*r,z=Math.sin(a)*r;if(inClearing(x,z))continue;
    d.position.set(x,0,z);d.rotation.y=Math.random()*3;d.scale.setScalar(.7+Math.random()*.7);d.updateMatrix();im.setMatrixAt(k++,d.matrix);}
  im.count=k;im.receiveShadow=true;scene.add(im);return im;}
cards(tuftTex,2600,.7,6,45);cards(flowTex,260,.55,9,32);

// ---------- leaf-card trees and bushes (crown cards with normals out of the crown centre) ----------
const leafTex=cnv(256,256,(g,w,h)=>{for(let q=0;q<4;q++){const ox=(q%2)*w/2,oy=(q>>1)*h/2;for(let i=0;i<34;i++){const a=Math.random()*7,r=Math.random()*w*.19;
  g.fillStyle=['#4f7f3a','#5f9442','#6fa84d','#87bb5e'][(i+q)%4];g.save();g.translate(ox+w/4+Math.cos(a)*r,oy+h/4+Math.sin(a)*r);g.rotate(a);g.beginPath();g.ellipse(0,0,13,6,0,0,7);g.fill();g.restore();}}});
leafTex.encoding=THREE.sRGBEncoding;
const leafMat=new THREE.MeshLambertMaterial({map:leafTex,alphaTest:.5,side:THREE.DoubleSide});
leafMat.onBeforeCompile=s=>{s.uniforms.uT=swayU;s.uniforms.uW=windU;s.vertexShader='uniform float uT;uniform float uW;attribute float sw;\n'+s.vertexShader
  .replace('#include <begin_vertex>','#include <begin_vertex>\ntransformed.x+=sin(uT*1.7+position.y*.8)*sw*(.05+uW*.25);transformed.z+=cos(uT*1.3+position.x)*sw*(.03+uW*.12);')
  .replace('#include <lights_lambert_vertex>','#include <lights_lambert_vertex>\n#ifdef DOUBLE_SIDED\nvLightBack=vLightFront;vIndirectBack=vIndirectFront;\n#endif');};
const leafDepth=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:leafTex,alphaTest:.5});
const BARK=M(0x7a5a3e);
function crown(cx,cy,cz,rad,n,cardS){const P=[],N=[],U=[],S=[],I=[];
  for(let i=0;i<n;i++){const v=new THREE.Vector3().randomDirection?new THREE.Vector3().randomDirection():new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();
    v.y=Math.abs(v.y)*.8+v.y*.2;const p=v.clone().multiplyScalar(rad*(.55+Math.random()*.45));const nrm=v.clone().add(new THREE.Vector3(0,.35,0)).normalize();
    const ax=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize(),ay=new THREE.Vector3().crossVectors(nrm,ax).normalize();ax.crossVectors(ay,nrm);
    const q=(Math.random()*4|0),u0=(q%2)*.5,v0=(q>>1)*.5,b=P.length/3,s=cardS*(.8+Math.random()*.5);
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,c])=>{const w=p.clone().addScaledVector(ax,a*s/2).addScaledVector(ay,c*s/2);P.push(cx+w.x,cy+w.y,cz+w.z);N.push(nrm.x,nrm.y,nrm.z);U.push(u0+(a+1)/4,v0+(c+1)/4);S.push(Math.max(0,(w.y+rad)/(2*rad)));});
    I.push(b,b+1,b+2,b,b+2,b+3);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.setAttribute('sw',new THREE.Float32BufferAttribute(S,1));g.setIndex(I);
  const m=new THREE.Mesh(g,leafMat);m.customDepthMaterial=leafDepth;m.castShadow=m.receiveShadow=true;scene.add(m);return m;}
function tree(x,z,h){const t=mesh(new THREE.CylinderGeometry(.16*h/5,.3*h/5,h*.7,7),BARK,x,h*.35,z);
  [[.9,.5],[-.7,.6],[.2,-.8]].forEach(([a,b])=>{const l=mesh(new THREE.CylinderGeometry(.06,.1,h*.35,5),BARK,x+a*h*.09,h*.62,z+b*h*.09);l.rotation.set(b*.6,0,-a*.6);});
  crown(x,h*.78,z,h*.32,150,h*.2);}
[[-14,-9,7],[-17,4,8],[-9,-16,6.5],[6,-17,7.5],[17,-8,6],[-20,-18,9],[22,8,7],[-6,17,6],[14,17,8],[-24,12,7]].forEach(a=>tree(...a));
const bushes=[];function bush(x,z,r){const b=crown(x,r*.7,z,r,60,r*.7);bushes.push(new THREE.Vector3(x,r*.7,z));return b;}
bush(-11.5,3.5,1.1);bush(9.5,-8,1);bush(-4,-11.5,1.2);bush(11,5.5,.9);

// ---------- 1. Kip's camper van (a plain 70s-style van, no real make) ----------
const VAN={col:0,pat:0,door:false,lights:false};
const VANCOL=[0xf3e6c4,0x9fd0c8,0xf2b46a,0xe98f8f,0xb7c98a];
const van=new THREE.Group();van.position.set(-6.2,0,-3.4);van.rotation.y=.5;scene.add(van);
function vanSkin(){return cnv(512,256,(g,w,h)=>{const c='#'+new THREE.Color(VANCOL[VAN.col]).getHexString();g.fillStyle=c;g.fillRect(0,0,w,h);
  g.fillStyle='#fffaf0';g.fillRect(0,0,w,h*.42);g.fillStyle='rgba(0,0,0,.08)';g.fillRect(0,h*.42,w,4);
  if(VAN.pat===1){g.fillStyle='#d9783e';g.fillRect(0,h*.5,w,h*.07);g.fillStyle='#f2b632';g.fillRect(0,h*.6,w,h*.07);g.fillStyle='#8a5a8a';g.fillRect(0,h*.7,w,h*.07);}
  if(VAN.pat===2){for(let i=0;i<12;i++){const x=20+i*42+(i%2)*10,y=h*.62+(i%3)*22;g.fillStyle=['#fff','#ffd84a','#f4a6c8'][i%3];for(let p=0;p<5;p++){g.beginPath();g.arc(x+Math.cos(p*1.26)*9,y+Math.sin(p*1.26)*9,7,0,7);g.fill();}g.fillStyle='#e8a020';g.beginPath();g.arc(x,y,5,0,7);g.fill();}}
  if(VAN.pat===3){g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<9;i++){g.beginPath();g.moveTo(i*60,h);g.quadraticCurveTo(i*60+30,h*.55,i*60+60,h);g.fill();}}});}
let vanMat=M(0xffffff,{map:vanSkin()});
const body=mesh(new THREE.BoxGeometry(4.4,1.75,2),vanMat,0,1.25,0,van);
const roof=mesh(new THREE.BoxGeometry(4.2,.18,1.9),M(0xfffaf0),0,2.2,0,van);
const nose=mesh(new THREE.BoxGeometry(.5,1.4,2),vanMat,2.35,1.1,0,van);nose.rotation.z=-.12;
const glass=M(0x2d4560);
mesh(new THREE.BoxGeometry(.06,.6,1.7),glass,2.64,1.75,0,van).rotation.z=-.12;
[-1.2,.1].forEach(x=>{mesh(new THREE.BoxGeometry(.9,.5,.04),glass,x,1.75,1.01,van);mesh(new THREE.BoxGeometry(.9,.5,.04),glass,x,1.75,-1.01,van);});
mesh(new THREE.BoxGeometry(.7,.5,.04),glass,1.55,1.75,-1.01,van);
const bump=M(0xc9ccd2);mesh(new THREE.BoxGeometry(.2,.18,2.1),bump,2.65,.5,0,van);mesh(new THREE.BoxGeometry(.2,.18,2.1),bump,-2.25,.5,0,van);
const WH=M(0x22232a),HUB=M(0xe8e8ea);
[[1.45,1],[1.45,-1],[-1.4,1],[-1.4,-1]].forEach(([x,z])=>{const w=mesh(new THREE.CylinderGeometry(.42,.42,.3,16),WH,x,.42,z,van);w.rotation.x=Math.PI/2;const hb=mesh(new THREE.CylinderGeometry(.2,.2,.32,10),HUB,x,.42,z,van);hb.rotation.x=Math.PI/2;});
const hlMat=new THREE.MeshToonMaterial({color:0xfff6d0,gradientMap:grad,emissive:0x000000});
[.62,-.62].forEach(z=>{const l=mesh(new THREE.SphereGeometry(.16,12,8),hlMat,2.62,1.02,z,van);l.scale.x=.4;});
const beams=[.62,-.62].map(z=>{const s=new THREE.SpotLight(0xfff2c8,0,40,.42,.5,1.2);s.position.set(2.7,1.02,z);const tg=new THREE.Object3D();tg.position.set(14,.2,z*2);van.add(s,tg);s.target=tg;return s;});
// sliding side door (opens toward the back) and the inside: Dad's wooden shelves, the fold bed, the carved sign from chapter 12
const door=new THREE.Group();door.position.set(.75,0,1.02);van.add(door);
mesh(new THREE.BoxGeometry(1.1,1.6,.06),vanMat,0,1.2,0,door);mesh(new THREE.BoxGeometry(.8,.45,.03),glass,0,1.72,.03,door);
mesh(new THREE.BoxGeometry(4.1,.04,1.85),M(0x5b4636),0,.43,0,van);
const WOOD=M(0xc89a62),WOOD2=M(0xa97a48);
mesh(new THREE.BoxGeometry(1.4,.08,.45),WOOD,-1.2,1.55,-.7,van);mesh(new THREE.BoxGeometry(1.4,.08,.45),WOOD,-1.2,1.05,-.7,van);
mesh(new THREE.BoxGeometry(1.8,.18,1),WOOD2,-1,.7,.1,van);mesh(new THREE.BoxGeometry(1.7,.12,.95),M(0x6f8fc0),-1,.85,.1,van);
const carved=mesh(new THREE.PlaneGeometry(.9,.3),new THREE.MeshLambertMaterial({map:cnv(256,86,(g,w,h)=>{g.fillStyle='#b8834e';g.fillRect(0,0,w,h);g.strokeStyle='#7a5230';g.lineWidth=6;g.strokeRect(4,4,w-8,h-8);g.fillStyle='#5a3a20';g.font='700 34px Georgia,serif';g.textAlign='center';g.fillText("Kip's Café",w/2,h*.66);})}),.2,1.55,-.95,van);
carved.castShadow=false;
hot(van,'camp_van',()=>toggleDoor());ink(van,.025);

// ---------- 2. dome tent for two: pitch animation, blown away by the wind, 4 pegs ----------
const TENT={up:1,goal:1,blown:0};
const tent=new THREE.Group();tent.position.set(4.4,0,-3.2);tent.rotation.y=-.4;scene.add(tent);
const tentBody=new THREE.Group();tent.add(tentBody);
const fly=mesh(new THREE.SphereGeometry(1.25,28,14,0,Math.PI*2,0,Math.PI/2),M(0xe8823a),0,0,0,tentBody);fly.scale.set(1.25,1.05,1);
const tdoor=mesh(new THREE.CircleGeometry(.62,18,0,Math.PI),M(0x5a2f18,{side:THREE.DoubleSide}),1.5,.02,0,tentBody);tdoor.rotation.set(0,Math.PI/2,0);tdoor.rotation.order='YXZ';tdoor.rotation.x=-.28;tdoor.scale.y=1.25;// zipped door
mesh(new THREE.SphereGeometry(1.27,20,8,0,Math.PI*2,0,.32),M(0x3d7fae),0,0,0,tentBody).scale.set(1.25,1.05,1);
const poleM=M(0x2b2b30);[.78,-.78].forEach(r=>{const p=mesh(new THREE.TorusGeometry(1.3,.025,6,24,Math.PI),poleM,0,0,0,tentBody);p.rotation.y=r;p.scale.set(1.2,1.03,1);});
const pegs=[];[[1.7,1.3],[-1.7,1.3],[1.7,-1.3],[-1.7,-1.3]].forEach(([x,z],i)=>{const p=mesh(new THREE.CylinderGeometry(.03,.01,.3,5),M(0xd8d8dc),x,.1,z,tent);p.rotation.z=.4*Math.sign(x);
  const line=mesh(new THREE.CylinderGeometry(.008,.008,1,3),M(0xf0f0f0),x*.7,.45,z*.75,tentBody);line.lookAt(tent.localToWorld(new THREE.Vector3(x,.1,z)));line.rotateX(Math.PI/2);pegs.push({id:'peg_'+(i+1),p});});
hot(tent,'camp_tent',()=>pitch());ink(tentBody,.02);
let blowT=0;const snag=new THREE.Vector3(-11.5,0,3.5);// tent_snag: the bush the tent ends up in

// ---------- 3. campfire: stone ring, logs, layered flame cards, sparks, smoke, flickering light ----------
const FIRE={state:1};

 {n:'บ่าย',sky:0x8ec9ff,fog:0xcfe6ff,sun:1.2,sc:0xfff1d6,hemi:.55,hs:0xbfe0ff,hg:0x6b7a4a,el:52,az:-40,st:0},

 {n:'รุ่งสาง',sky:0xf2c2a6,fog:0xe9d2c6,sun:.55,sc:0xffc69a,hemi:.36,hs:0xc9c8ec,hg:0x5f6a4a,el:8,az:95,st:.12}];
let tod=0,todGoal=0,auto=false;const cA=new THREE.Color(),cB=new THREE.Color();
const mix=(a,b,k)=>cA.setHex(a).lerp(cB.setHex(b),k);
let dark=0;
function applyTime(t){const i=Math.floor(t)%4,j=(i+1)%4,k=t-Math.floor(t),A=KEYS[i],B=KEYS[j],L=(a,b)=>a+(b-a)*k;
  const fogOn=W.fogA,rainOn=W.rainA;
  scene.background=mix(A.sky,B.sky,k).clone().lerp(cB.setHex(0x9aa3ad),rainOn*.5*(1-dark*.6)).lerp(cB.setHex(0xdfe5ea),fogOn*(1-dark*.7));
  const fc=mix(A.fog,B.fog,k).clone().lerp(cB.setHex(0xe8edf0),fogOn*(1-dark*.6));scene.fog.color.copy(fc);
  scene.fog.near=L(40,40)*(1-fogOn*.95)+.5;scene.fog.far=140*(1-fogOn*.86)*(1-rainOn*.3);
  dark=Math.min(1,Math.max(0,(L(A.st,B.st))));
  sun.intensity=L(A.sun,B.sun)*(1-rainOn*.55)*(1-fogOn*.5);sun.color.copy(mix(A.sc,B.sc,k));hemi.intensity=L(A.hemi,B.hemi)*(1+fogOn*.3);
  hemi.color.copy(mix(A.hs,B.hs,k));hemi.groundColor.copy(mix(A.hg,B.hg,k));
  let az=A.az+(((B.az-A.az+540)%360)-180)*k;const el=L(A.el,B.el)*Math.PI/180,a=az*Math.PI/180;sun.position.set(Math.cos(a)*Math.cos(el)*50,Math.sin(el)*50,Math.sin(a)*Math.cos(el)*50);
  starDome.material.opacity=L(A.st,B.st)*(1-fogOn)*(1-rainOn);$('#tod').textContent=(k<.5?A:B).n;}

pegs.forEach(p=>POINTS[p.id]=p.p);
const tags=Object.entries(POINTS).map(([id,o])=>{const d=document.createElement('div');d.className='tag';d.textContent=id;d.style.display='none';document.body.appendChild(d);return{id,o,d};});
let showPts=false;$('#bPts').onclick=()=>{showPts=!showPts;btn('#bPts',showPts);};
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let downAt=null;
R.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];audio();});
R.domElement.addEventListener('pointerup',e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>8)return;mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mv,cam);
  const h=ray.intersectObjects(pick,true).find(x=>x.object.userData.hot);if(h){h.object.userData.hot.act();say(h.object.userData.hot.id);}});
window.CAMPKIT={_scene:scene,_ground:ground,setTime,setRain,setFog,setWind,shootingStar,setFire,pitch,blow,toggleDoor,setLights,horn,points:()=>Object.keys(POINTS),
  sign:t=>{signText=t;drawSign();},foodBox:v=>{BOX.open=v==null?!BOX.open:!!v;},chick:v=>{chick.visible=!!v;},torch:v=>{TORCH.on=!!v;},state:()=>({tod,FIRE,TENT,VAN,W,BOX})};

// ---------- loop ----------
let fN=0,fT=0;const tmp=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());T+=dt;swayU.value=T;fN++;fT+=dt;if(fT>1){$('#fps').textContent='fps '+Math.round(fN/fT);fN=0;fT=0;}
  if(auto){todGoal+=dt/20;}tod+=(todGoal-tod)*Math.min(1,dt*1.6);
  const ap=(k,on,s)=>{W[k]+=((on?1:0)-W[k])*Math.min(1,dt*s);};ap('rainA',W.rain,1.2);ap('fogA',W.fog,.5);ap('windA',W.wind,1);
  applyTime(tod);windU.value=.25+W.windA*.9;
  // fire
  const fs=FIRE.state;flames.forEach((f,i)=>{const on=fs===1;const fl=.85+Math.sin(T*9+f.ph*3)*.12+Math.sin(T*23+i)*.06;f.m.visible=on;f.m.scale.set(1,fl,1);f.m.rotation.z=-W.windA*.35+Math.sin(T*3+i)*.04;f.m.lookAt(cam.position.x,f.m.parent.position.y+.18,cam.position.z);f.m.rotateZ(W.windA*.35);});
  fLight.intensity=(fs===1?2.2+Math.sin(T*13)*.25+Math.sin(T*31)*.15:fs===2?.5+Math.sin(T*2)*.08:0)*(.35+dark*.9);
  emberM.opacity=fs===2?.55+Math.sin(T*2.2)*.15:fs===1?.25:0;logs.forEach(l=>l.material=fs===0?charM:logM);
  for(let i=0;i<NS;i++){const s=spv[i];s.l+=dt*(.6+i%5*.1);if(s.l>1){s.l=0;s.x=(Math.random()-.5)*.4;s.z=(Math.random()-.5)*.4;}const on=fs===1;sp.set([s.x+(s.l*W.windA*1.5)+Math.sin(T*3+i)*.05*s.l,on?.3+s.l*2.2:-9,s.z],i*3);}
  sparkG.attributes.position.needsUpdate=true;
  smoke.forEach((s,i)=>{s.userData.l+=dt*.18;if(s.userData.l>1)s.userData.l=0;const l=s.userData.l;s.position.set(l*W.windA*3+Math.sin(T*.7+i)*.2*l,.6+l*3.4,Math.cos(T*.5+i)*.15*l);s.scale.setScalar(.5+l*1.8);
    s.material.opacity=(fs===0?0:fs===2?.5:.32)*Math.sin(l*Math.PI)*(1-W.rainA*.5);});
  if(gains.fire)gains.fire.gain.value=(fs===1?.025+Math.random()*.03:0);
  // van
  door.position.x+=((VAN.door?-.45:.75)-door.position.x)*Math.min(1,dt*5);door.position.z=1.02+(VAN.door?.12:0);
  beams.forEach(b=>b.intensity=VAN.lights?2.6:0);hlMat.emissive.setHex(VAN.lights?0xfff0b0:0x000000);
  lgl.emissive.setHex(dark>.3?0xffc860:0x000000);lLight.intensity=dark>.3?1.3*dark:0;tBeam.intensity=TORCH.on?3:0;
  lid.rotation.x+=((BOX.open?-1.9:0)-lid.rotation.x)*Math.min(1,dt*6);
  // tent: pitch / fold / blown into the bush
  TENT.up+=((TENT.goal?1:0)-TENT.up)*Math.min(1,dt*1.6);const u=TENT.up;tentBody.scale.set(.3+.7*u,Math.max(.03,u*u*(3-2*u)),.3+.7*u);
  tentBody.rotation.z=W.windA*Math.sin(T*6)*.012;tentBody.scale.x*=1+W.windA*Math.sin(T*9)*.015;
  if(TENT.blown){blowT=Math.min(1,blowT+dt*.35);const p0=new THREE.Vector3(4.4,0,-3.2),e=blowT*blowT*(3-2*blowT);
    tent.position.lerpVectors(p0,snag,e);tent.position.y=Math.sin(blowT*Math.PI)*2.2+e*.35;tent.rotation.z=Math.sin(blowT*Math.PI*2)*.6;tent.rotation.x=e*.5;tent.rotation.y=-.4+e*2.5;}
  // weather
  rain.material.opacity=W.rainA*.55;if(W.rainA>.01){for(let i=0;i<NR;i++){let y=rp[i*6+1]-dt*22;let x=rp[i*6]-dt*W.windA*6;if(y<0){y+=25;}if(x<-30)x+=60;rp[i*6]=x;rp[i*6+1]=y;rp[i*6+3]=x+W.windA*.15;rp[i*6+4]=y-.5;}rg.attributes.position.needsUpdate=true;}
  wetMat.color.copy(DRY).lerp(WET,W.rainA);wetMat.specular.setScalar(W.rainA*.35);wetMat.shininess=4+W.rainA*60;// wet ground shines
  dc.style.opacity=W.rainA;if(W.rainA>.01){if(Math.random()<.3)drops.push({x:Math.random()*dc.width,y:Math.random()*dc.height,r:3+Math.random()*7,l:1});dctx.clearRect(0,0,dc.width,dc.height);
    for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.l-=dt*.4;d.y+=dt*d.r*3;if(d.l<=0){drops.splice(i,1);continue;}dctx.fillStyle=`rgba(220,235,255,${.25*d.l})`;dctx.beginPath();dctx.ellipse(d.x,d.y,d.r*.8,d.r,0,0,7);dctx.fill();dctx.strokeStyle=`rgba(255,255,255,${.35*d.l})`;dctx.lineWidth=1;dctx.stroke();}}
  if(gains.rain){gains.rain.gain.value=W.rainA*.12;gains.wind.gain.value=W.windA*(.08+Math.sin(T*.7)*.03);}
  blanket.rotation.z=.8+W.windA*Math.sin(T*5)*.06;sign.rotation.z=W.windA*Math.sin(T*4)*.01;
  for(let i=shooters.length-1;i>=0;i--){const s=shooters[i];s.t+=dt;const head=s.p.clone().addScaledVector(s.d,s.t*140),tail=s.p.clone().addScaledVector(s.d,Math.max(0,s.t*140-26));
    s.l.geometry.setFromPoints([tail,head]);s.l.material.opacity=Math.max(0,1-s.t/1.1)*Math.max(.25,dark);if(s.t>1.1){scene.remove(s.l);shooters.splice(i,1);}}
  // interaction tags
  tags.forEach(t=>{if(!showPts){t.d.style.display='none';return;}t.o.getWorldPosition(tmp);tmp.y+=t.id.startsWith('peg')?.35:t.id==='camp_van'?2.6:1.6;tmp.project(cam);
    const vis=tmp.z<1;t.d.style.display=vis?'block':'none';t.d.style.left=(tmp.x*.5+.5)*innerWidth+'px';t.d.style.top=(-tmp.y*.5+.5)*innerHeight+'px';});
  ctl.update();R.render(scene,cam);}
applyTime(0);loop();
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();sizeDrops();});
// ?t=2&rain&fog&wind&fire=0&tent=0&blow&door&lights&pts : start states for screenshots
const q=location.search;const qt=/[?&]t=(\d)/.exec(q);if(qt){tod=todGoal=+qt[1];setTime(tod);}
if(/[?&]rain\b/.test(q))setRain(true);if(/[?&]fog\b/.test(q))setFog(true);if(/[?&]wind\b/.test(q))setWind(true);
const qf=/[?&]fire=(\d)/.exec(q);if(qf)setFire(+qf[1]);if(/[?&]tent=0/.test(q)){TENT.goal=0;TENT.up=0;btn('#bTent',0);}if(/[?&]blow\b/.test(q))blow();
if(/[?&]door\b/.test(q))toggleDoor(true);if(/[?&]lights\b/.test(q))setLights(true);if(/[?&]pts\b/.test(q)){showPts=true;btn('#bPts',1);}
})();
</script>
